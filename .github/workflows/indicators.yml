name: Monthly Africa Indicators Update

on:
  schedule:
    - cron: "17 1 1 * *"   # 매월 1일 10:17 (KST)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

jobs:
  update-indicators:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch World Bank indicators
        run: python scripts/fetch_indicators.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update indicators $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      # 자동 작업(github-actions)이 올린 변경은 사이트 재배포를 자동으로 일으키지 않는 경우가 있어,
      # 수집이 끝나면 사이트 다시 만들기를 직접 요청한다.
      - name: Request GitHub Pages rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
