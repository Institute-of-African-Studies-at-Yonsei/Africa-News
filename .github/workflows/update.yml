name: Update resource database

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 (KST)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect news, papers and reports
        run: python fetch_resources.py

      - name: Commit and push updated resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources.json
          git diff --cached --quiet || git commit -m "chore: update resources $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      # 자동 작업(github-actions)이 올린 변경은 사이트 재배포를 자동으로 일으키지 않는 경우가 있어,
      # 수집이 끝나면 사이트 다시 만들기를 직접 요청한다.
      - name: Request GitHub Pages rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
