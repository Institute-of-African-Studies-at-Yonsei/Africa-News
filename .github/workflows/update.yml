name: Update resource database

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 (KST)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

jobs:
  update-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect news, papers and reports
        run: python fetch_resources.py

      - name: Commit and push updated resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources.json
          git diff --cached --quiet || git commit -m "chore: update resources $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
